name: Android Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK y NDK
        run: |
          echo "Configurando Android SDK y NDK..."
          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          # Aceptar licencias e instalar explícitamente Platform 36 (Android 16 / One UI 8.5), Build-Tools 36.0.0 y NDK 27 (alineación ELF 16 KB)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK configurado en: $NDK_DIR"

          # Agregar build-tools 36.0.0 al PATH para apksigner y zipalign (-P 16)
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/36.0.0"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "Build-tools configurado en: $BUILD_TOOLS_DIR"

      - name: Configurar Rust Toolchain y Targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Instalar dependencias del proyecto (npm)
        run: npm ci --ignore-scripts

      - name: Preparar y parchear proyecto Android (scripts/setup-android.sh)
        run: |
          chmod +x scripts/setup-android.sh
          ./scripts/setup-android.sh

      - name: Compilar APK Universal y Split por Arquitectura
        run: |
          echo "Compilando APK Universal..."
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64

          echo "Compilando APKs split por ABI..."
          npx tauri android build --apk --split-per-abi --target aarch64 --target armv7 --target x86_64

      - name: Firmar y organizar APKs para distribución
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist-android
          VERSION=$(node -p "require('./package.json').version")
          echo "Versión de la aplicación: v$VERSION"

          # Determinar keystore de firma (Release si existen los secretos, Debug si aún no se configuran)
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "✔ Usando Keystore de Release proporcionada por secretos de GitHub..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            KS_PATH="release.keystore"
            KS_PASS="$KEYSTORE_PASSWORD"
            KS_KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            KS_ALIAS="$KEY_ALIAS"
            SIGN_TYPE="release"
          else
            echo "ℹ Secretos de Keystore no configurados. Generando Keystore Debug para APK listo para instalar..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NetTerminal,OU=Mobile,O=Parzval-Net,C=CL"
            KS_PATH="debug.keystore"
            KS_PASS="android"
            KS_KEY_PASS="android"
            KS_ALIAS="androiddebugkey"
            SIGN_TYPE="debug"
          fi

          # Buscar todos los APKs generados en src-tauri/gen/android
          echo "APKs generados encontrados:"
          find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*.apk"

          # Procesar cada APK
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*.apk" | grep -v "unaligned")

          for apk in "${APKS[@]}"; do
            base=$(basename "$apk")
            out_name=""

            if [[ "$base" == *"universal"* ]] || [[ "$apk" == *"universal"* ]]; then
              out_name="NetTerminal_${VERSION}_universal.apk"
            elif [[ "$base" == *"arm64"* ]] || [[ "$apk" == *"arm64"* ]]; then
              out_name="NetTerminal_${VERSION}_arm64-v8a.apk"
            elif [[ "$base" == *"armeabi-v7a"* ]] || [[ "$apk" == *"armeabi-v7a"* ]] || [[ "$base" == *"-arm-"* ]] || [[ "$apk" == *"/arm/"* ]]; then
              out_name="NetTerminal_${VERSION}_armeabi-v7a.apk"
            elif [[ "$base" == *"x86_64"* ]] || [[ "$apk" == *"x86_64"* ]]; then
              out_name="NetTerminal_${VERSION}_x86_64.apk"
            elif [[ "$base" == *"x86"* ]] || [[ "$apk" == *"x86"* ]]; then
              out_name="NetTerminal_${VERSION}_x86.apk"
            else
              out_name="NetTerminal_${VERSION}_${base}"
            fi

            target_apk="dist-android/$out_name"
            echo "Procesando $base -> $target_apk ($SIGN_TYPE)..."

            # Alinear APK a páginas de 16 KB (-P 16) para compatibilidad con Android 15/16+
            if command -v zipalign >/dev/null 2>&1; then
              zipalign -P 16 -f 4 "$apk" "$target_apk.aligned" 2>/dev/null \
                || zipalign -p -f 4 "$apk" "$target_apk.aligned" 2>/dev/null \
                || cp "$apk" "$target_apk.aligned"
              mv "$target_apk.aligned" "$target_apk"
            else
              cp "$apk" "$target_apk"
            fi

            # Firmar con apksigner (v1 + v2 + v3 explícitos para Android 14 / 16 y Samsung Knox; sin .idsig v4)
            apksigner sign --ks "$KS_PATH" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KS_KEY_PASS" \
              --ks-key-alias "$KS_ALIAS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "$target_apk" \
              "$target_apk"

            # Verificar alineación de 16 KB y firma
            zipalign -c -P 16 4 "$target_apk" || zipalign -c 4 "$target_apk"
            apksigner verify --verbose "$target_apk"
            echo "✔ Firmado exitosamente: $target_apk"
          done

          # Generar checksums SHA-256
          cd dist-android
          sha256sum *.apk > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt
          cd ..

      - name: Subir artefactos de GitHub Actions (APKs)
        uses: actions/upload-artifact@v7
        with:
          name: NetTerminal-Android-v${{ github.ref_name }}
          path: dist-android/*
          retention-days: 30

      - name: Adjuntar APKs a GitHub Release (en Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Adjuntando APKs al Release $TAG en $REPO..."
          # Reintentar o verificar si el release ya existe
          for i in {1..5}; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release $TAG encontrado. Subiendo APKs..."
              gh release upload "$TAG" dist-android/*.apk dist-android/SHA256SUMS-android.txt --clobber --repo "$REPO"
              echo "✔ Archivos adjuntados con éxito al Release."
              exit 0
            else
              echo "El release $TAG aún no existe. Esperando 10s (intento $i/5)..."
              sleep 10
            fi
          done

          echo "Creando release $TAG con los APKs de Android..."
          VERSION=$(node -p "require('./package.json').version")
          if [ -f "novedades/v${VERSION}.md" ]; then
            gh release create "$TAG" dist-android/*.apk dist-android/SHA256SUMS-android.txt \
              --title "NetTerminal v${VERSION} para Android (One UI 6.1 / 8.5 & Material Design 3)" \
              --notes-file "novedades/v${VERSION}.md" \
              --repo "$REPO"
          else
            gh release create "$TAG" dist-android/*.apk dist-android/SHA256SUMS-android.txt \
              --title "NetTerminal $TAG" \
              --notes "Versión $TAG - Incluye paquetes de Android (.apk) para ARM64, ARMv7, x86_64 y Universal." \
              --repo "$REPO"
          fi
