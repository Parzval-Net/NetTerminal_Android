name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Dependencias con vulnerabilidades conocidas (RustSec y npm) detienen el build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm audit --audit-level=high
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  build:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Evita incrustar rutas del runner (usuario, carpetas) en los mensajes de pánico.
      - name: Recortar rutas locales del binario
        shell: bash
        run: |
          H="$HOME"; [ "$RUNNER_OS" = "Windows" ] && H="$(cygpath -w "$HOME")"
          W="${{ github.workspace }}"
          # Formato codificado (separador 0x1f): admite rutas con espacios.
          printf 'CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=%s=~\x1f--remap-path-prefix=%s=.\n' "$H" "$W" >> "$GITHUB_ENV"

      # Firma de actualizaciones: la clave privada vive solo en los secretos del repositorio.
      # Las compilaciones locales no la necesitan (sin --config no se generan artefactos).
      - run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
        env:
          # La app se actualiza desde el repositorio que la compila (un fork, desde sí mismo).
          NT_UPDATE_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Pieza portable de cada sistema, en tar para conservar permisos de ejecución.
      - name: Pieza portable
        shell: bash
        run: |
          mkdir -p piece
          case "${{ runner.os }}" in
            Windows) cp src-tauri/target/release/net-terminal.exe piece/NetTerminal.exe ;;
            macOS)   cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/NetTerminal.app piece/ ;;
            Linux)   cp src-tauri/target/release/bundle/appimage/*.AppImage piece/NetTerminal.AppImage
                     chmod +x piece/NetTerminal.AppImage ;;
          esac
          tar -czf portable-${{ runner.os }}.tgz -C piece .

      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}
          path: portable-${{ runner.os }}.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

  # Una sola carpeta con los tres ejecutables y los datos compartidos (para un pendrive).
  portable:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          merge-multiple: true
      - name: Armar NetTerminal-portable
        run: |
          mkdir NetTerminal
          for f in portable-*.tgz; do tar -xzf "$f" -C NetTerminal; done
          touch NetTerminal/portable
          mkdir -p NetTerminal/data
          cat > NetTerminal/LEEME.txt <<'EOF'
          NetTerminal portable (Windows, macOS y Linux)

          Windows: NetTerminal.exe
          macOS:   NetTerminal.app (la primera vez: clic derecho > Abrir)
          Linux:   NetTerminal.AppImage

          Sesiones, ajustes, notas y logs se guardan en la carpeta "data" y son
          compartidos por los tres sistemas. No requiere permisos de administrador.
          EOF
          zip -qry NetTerminal-portable.zip NetTerminal
      - uses: actions/upload-artifact@v4
        with:
          name: NetTerminal-portable
          path: NetTerminal-portable.zip

  # Al publicar un tag v* crea el Release que consulta el aviso de versión nueva.
  release:
    needs: portable
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      # Índice que consulta el actualizador de la app: versión, URL y firma por plataforma.
      # Si falta alguna plataforma el release se detiene: no se publica un índice incompleto.
      - name: Índice de actualizaciones (latest.json)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${TAG#v}"
          # Las mismas novedades van al release y al aviso dentro de la app.
          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > notas.md || echo "Ver el release $TAG" > notas.md
          mac=$(find artefactos -name '*.app.tar.gz' | head -1)
          cp "$mac" "artefactos/NetTerminal_${ver}_universal.app.tar.gz"
          cp "$mac.sig" "artefactos/NetTerminal_${ver}_universal.app.tar.gz.sig"
          python3 - <<'PY'
          import glob, json, os, datetime
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          def pick(pattern):
              files = [f for f in glob.glob("artefactos/**/" + pattern, recursive=True) if os.path.exists(f + ".sig")]
              if not files:
                  raise SystemExit(f"Falta el artefacto firmado: {pattern}")
              f = files[0]
              return {"signature": open(f + ".sig").read().strip(), "url": base + os.path.basename(f)}
          mac = pick(f"NetTerminal_{tag[1:]}_universal.app.tar.gz")
          index = {
              "version": tag[1:],
              "notes": open("notas.md").read().strip()[:4000],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": mac,
                  "darwin-x86_64": mac,
                  "windows-x86_64": pick("*-setup.exe"),
                  "linux-x86_64": pick("*.AppImage"),
              },
          }
          json.dump(index, open("artefactos/latest.json", "w"), indent=2)
          print(json.dumps(index, indent=2))
          PY

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artefactos -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name 'NetTerminal-portable.zip' -o -name 'NetTerminal_*_universal.app.tar.gz' -o -name 'latest.json' \))
          gh release create "${{ github.ref_name }}" "${files[@]}" \
            --repo "${{ github.repository }}" --title "NetTerminal ${{ github.ref_name }}" --notes-file notas.md
