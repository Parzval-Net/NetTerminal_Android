<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bff"/>
      <stop offset="1" stop-color="#1e2f8c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fc"/>
      <stop offset="1" stop-color="#d5ddeb"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab6ca"/>
      <stop offset="1" stop-color="#cfd8e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0a1440" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo (grilla de íconos de macOS: 824 px con margen de 100) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <g filter="url(#shadow)">
    <!-- Pie -->
    <path d="M466 640 H558 L586 728 H438 Z" fill="url(#stand)"/>
    <rect x="374" y="718" width="276" height="30" rx="15" fill="url(#bezel)"/>
    <!-- Monitor -->
    <rect x="222" y="262" width="580" height="398" rx="42" fill="url(#bezel)"/>
    <rect x="250" y="290" width="524" height="330" rx="22" fill="url(#screen)"/>
  </g>

  <!-- Barra de ventana -->
  <circle cx="286" cy="324" r="10" fill="#ff5f57"/>
  <circle cx="318" cy="324" r="10" fill="#febc2e"/>
  <circle cx="350" cy="324" r="10" fill="#28c840"/>

  <!-- Prompt >_ -->
  <polyline points="300,392 356,436 300,480" fill="none" stroke="#4ade80" stroke-width="28"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="384" y="458" width="104" height="24" rx="10" fill="#4ade80"/>

  <!-- Líneas de salida -->
  <rect x="300" y="526" width="300" height="18" rx="9" fill="#5b8def" opacity="0.75"/>
  <rect x="300" y="564" width="190" height="18" rx="9" fill="#5b8def" opacity="0.45"/>
  <rect x="510" y="564" width="120" height="18" rx="9" fill="#c49bf2" opacity="0.55"/>
</svg>
